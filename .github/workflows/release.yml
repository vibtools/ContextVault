name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows x64 OneDir
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock

      - name: Verify public repository boundary
        run: python scripts/release/verify_public_tree.py

      - name: Install locked runtime and build dependencies
        run: python -m pip install -r requirements.lock -r requirements-build.lock

      - name: Verify release metadata
        shell: pwsh
        run: python scripts/release/verify_release_metadata.py --ref "$env:GITHUB_REF_NAME"

      - name: Verify release environment
        run: python scripts/test/check_environment.py

      - name: Run forensic test suite
        run: python scripts/test/run_tests.py

      - name: Compile Nuitka OneDir with MSVC
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC x64 build tools were not found." }
          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          cmd /d /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 && python scripts\build\build_windows.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify release ZIP
        run: python scripts/release/package_release.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ContextVault-Windows-x64
          path: |
            artifacts/ContextVault-Windows-x64.zip
            artifacts/ContextVault-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $notesPath = Join-Path "docs/release-notes" "$releaseVersion.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
              throw "Release notes were not found: $notesPath"
          }

          $heading = Get-Content -LiteralPath $notesPath -Encoding utf8 -TotalCount 1
          if ($heading -notmatch '^#\s+(.+)$') {
              throw "The first release-notes line must be a Markdown H1 title."
          }
          $releaseTitle = $Matches[1].Trim()
          $releaseBody = Join-Path $env:RUNNER_TEMP "ContextVault-$releaseVersion-release-notes.md"
          Get-Content -LiteralPath $notesPath -Encoding utf8 |
              Select-Object -Skip 1 |
              Set-Content -LiteralPath $releaseBody -Encoding utf8

          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/ContextVault-Windows-x64.zip" `
            "artifacts/ContextVault-Windows-x64.zip.sha256" `
            --verify-tag `
            --notes-file "$releaseBody" `
            --title "$releaseTitle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
