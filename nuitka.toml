[project]
name = "ContextVault"
version = "1.0.0"
main_file = "src/app.py"

[nuitka]
standalone = true
onefile = false
output_dir = "build"
output_filename = "ContextVault"
follow_imports = true
lto = "yes"
windows_console_mode = "disable"
remove_output = true
report = "build-report.xml"
company_name = "Vib Tools"
product_name = "ContextVault"
file_version = "1.0.0"
product_version = "1.0.0"
copyright = "Copyright © Vib Tools"
windows_icon_from_ico = "assets/icons/app.ico"
enable_plugin = ["tk-inter"]
include_package_data = ["customtkinter"]
include_package = [
    "customtkinter",
    "playwright",
    "PIL",
    "bs4",
    "markdownify",
    "pydantic",
    "tenacity",
]
include_data_dir = [
    "assets=runtime/assets",
    "config=runtime/config",
    "config/schemas=runtime/schemas",
    "data/templates=runtime/templates",
    "assets/themes=runtime/themes",
    "assets/icons=runtime/icons",
]
include_data_files = [
    "README.txt=README.txt",
    "LICENSE=LICENSE",
]
nofollow_import_to = [
    "pytest",
    "pip",
    "setuptools",
    "wheel",
    "tkinter.test",
    "unittest",
]
noinclude_default_mode = "error"
assume_yes_for_downloads = false
msvc = "latest"
